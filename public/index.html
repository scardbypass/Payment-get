<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>Payment-Get</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#1d3557 0,#09090b 38%),#09090b;color:#f8fafc;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:24px}.glass{background:#ffffff0b;border:1px solid #ffffff14;backdrop-filter:blur(24px);border-radius:24px;box-shadow:0 24px 80px #0008}.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;margin-bottom:24px}.brand{font-weight:800;font-size:20px}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:22px}.value{font-size:30px;font-weight:800;margin-top:8px}.form{max-width:430px;margin:10vh auto;padding:28px}.input{width:100%;padding:13px 15px;border-radius:14px;border:1px solid #ffffff18;background:#0006;color:white;margin:7px 0 12px;outline:none}.btn{width:100%;border:0;border-radius:14px;padding:13px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-weight:700;cursor:pointer}.row{display:flex;gap:10px}.row .btn{width:auto}.hidden{display:none}.table{margin-top:16px;padding:0;overflow:auto}.table table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:14px;border-bottom:1px solid #ffffff0d}.pill{padding:5px 9px;border-radius:99px;background:#ffffff10}.error{color:#fca5a5;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.form{margin:5vh auto}}
</style></head><body><main class="wrap"><div id="auth" class="glass form"><h1>Payment-Get</h1><p class="muted">Payment Gateway Dashboard</p><div id="err" class="error"></div><input id="login" class="input" placeholder="Username / Gmail"><input id="password" class="input" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Masuk</button><p class="muted">Belum punya akun? <button style="background:none;border:0;color:#a78bfa" onclick="showReg()">Daftar</button></p></div><section id="app" class="hidden"><nav class="glass nav"><div class="brand">Payment-Get</div><button class="btn" style="width:auto" onclick="logout()">Keluar</button></nav><div class="grid"><div class="glass card"><div class="muted">Saldo</div><div id="balance" class="value">Rp 0</div></div><div class="glass card"><div class="muted">Status</div><div id="status" class="value">—</div></div><div class="glass card"><div class="muted">Subscription</div><div id="sub" class="value">—</div></div></div><div class="glass card" style="margin-top:16px"><h2>Buat Payment</h2><div class="row"><input id="amount" class="input" type="number" placeholder="Nominal"/><input id="reference" class="input" placeholder="Reference"/></div><button class="btn" onclick="createPayment()">Buat Tagihan</button><div id="result" class="muted" style="margin-top:12px"></div></div><div class="glass table"><table><thead><tr><th>Reference</th><th>Nominal</th><th>Status</th><th>Waktu</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>let token=localStorage.getItem('pg_token');const $=id=>document.getElementById(id);function fmt(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}function showReg(){ $('auth').innerHTML='<h1>Daftar</h1><p class="muted">Buat akun Payment-Get</p><div id="err" class="error"></div><input id="name" class="input" placeholder="Nama"><input id="username" class="input" placeholder="Username"><input id="email" class="input" placeholder="Gmail"><input id="phone" class="input" placeholder="Nomor HP"><input id="password" class="input" type="password" placeholder="Password min. 8 karakter"><button class="btn" onclick="register()">Daftar</button>'}async function req(path,opt={}){const r=await fetch(path,{...opt,headers:{'content-type':'application/json',authorization:token?'Bearer '+token:''}});const b=await r.json();if(!r.ok)throw Error(b.error||'Request gagal');return b}async function register(){try{const b=await req('/auth/register',{method:'POST',body:JSON.stringify({name:$('name').value,username:$('username').value,email:$('email').value,phone:$('phone').value,password:$('password').value})});token=b.token;localStorage.setItem('pg_token',token);load()}catch(e){$('err').textContent=e.message}}async function doLogin(){try{const b=await req('/auth/login',{method:'POST',body:JSON.stringify({login:$('login').value,password:$('password').value})});token=b.token;localStorage.setItem('pg_token',token);load()}catch(e){$('err').textContent=e.message}}async function load(){try{const [me,w,tx]=await Promise.all([req('/api/v1/me'),req('/api/v1/balance'),req('/api/v1/transactions')]);$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('balance').textContent=fmt(w.balance);$('status').textContent=me.status;$('sub').textContent=me.subscriptions?.[0]?.endsAt?new Date(me.subscriptions[0].endsAt).toLocaleDateString('id-ID'):'Tidak aktif';$('rows').innerHTML=(tx.items||[]).slice(0,50).map(x=>`<tr><td>${x.reference}</td><td>${fmt(x.amount)}</td><td><span class="pill">${x.type}</span></td><td>${new Date(x.createdAt).toLocaleString('id-ID')}</td></tr>`).join('')}catch(e){logout()}}async function createPayment(){try{const b=await req('/api/v1/payments',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({amount:Number($('amount').value),reference:$('reference').value})});$('result').textContent=`${b.paymentId} • Bayar ${fmt(b.payableAmount)} • berlaku sampai ${new Date(b.expiresAt).toLocaleTimeString('id-ID')}`}catch(e){$('result').textContent=e.message}}function logout(){localStorage.removeItem('pg_token');token=null;location.reload()}if(token)load();</script></body></html>
