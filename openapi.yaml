openapi: 3.0.3
info:
  title: Payment-Get API
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /auth/register:
    post: {summary: Register user, responses: {'201': {description: Created}}}
  /auth/login:
    post: {summary: Login with username or Gmail/email, responses: {'200': {description: OK}}}
  /api/v1/balance:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Balance}}}
  /api/v1/transactions:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Ledger}}}
  /api/v1/payments:
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Payment created}}}
  /api/v1/payments/{id}:
    get: {security: [{bearerAuth: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Payment}}}
  /api/v1/withdrawals:
    get: {security: [{bearerAuth: []}], responses: {'200': {description: Withdrawals}}}
    post: {security: [{bearerAuth: []}], responses: {'201': {description: Withdrawal}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
